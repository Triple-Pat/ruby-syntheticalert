name: Lint and Test
run-name: "Lint and Test: ${{ github.event.head_commit.message || github.event.pull_request.title }}"
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    name: Lint and Test (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      # --- Linting ---
      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint
      - name: RuboCop
        run: bundle exec rubocop

      # --- Tests ---
      - name: Minitest
        run: bundle exec rake test
        env:
          CI: "1"
      # Feeds the README's Coveralls badge with measured coverage. Main only:
      # fork PRs get a read-only token and the upload would fail. One matrix
      # leg only (the first, so the condition survives matrix edits), so
      # Coveralls sees one report per commit. A Coveralls outage must not
      # redden a run whose lint and tests passed, hence fail-on-error: false.
      - name: Coveralls
        if: github.ref == 'refs/heads/main' && strategy.job-index == 0
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/.resultset.json
          format: simplecov
          fail-on-error: false
