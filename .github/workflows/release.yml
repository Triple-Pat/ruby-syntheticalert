name: Release
run-name: "Release ${{ github.ref_name }}"
on:
  push:
    tags:
      - "v*"
permissions: {}
jobs:
  # A tag on a commit that fails lint or tests never reaches RubyGems. CI
  # also builds and checks the gem this workflow publishes.
  ci:
    name: Lint and Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to RubyGems
    needs: ci
    runs-on: ubuntu-latest
    # RubyGems trusts this workflow file in this environment and no other.
    environment:
      name: rubygems
      url: https://rubygems.org/gems/triplepat-syntheticalert
    permissions:
      contents: write # the draft GitHub Release
      id-token: write # trusted publishing: RubyGems exchanges this for a push key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
          path: pkg/
      - name: Check the tag names the gem's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          gem="pkg/triplepat-syntheticalert-${TAG#v}.gem"
          if [ ! -f "${gem}" ]; then
            echo "::error::tag ${TAG} does not match the built gem: $(ls pkg)"
            exit 1
          fi
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      # The runner image's own Ruby is enough to push a file; no gems are
      # installed or run here.
      - name: Publish to RubyGems
        run: gem push pkg/*.gem
      # Draft, so the release notes get a review before anyone sees them.
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft --verify-tag --title "${TAG}" --notes "" pkg/*.gem
